<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#4a3522"/><stop offset="1" stop-color="#160f09"/></radialGradient>
    <radialGradient id="disc" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#b8344a"/><stop offset="1" stop-color="#6e1624"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#b98a22"/></linearGradient>
    <radialGradient id="ink" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#4b4540"/><stop offset=".35" stop-color="#1a1714"/><stop offset="1" stop-color="#050404"/></radialGradient>
  </defs>
  <rect id="bgrect" width="512" height="512" fill="url(#bg)"/>
  <g id="emblem">
    <circle cx="256" cy="262" r="176" fill="url(#gold)"/>
    <circle cx="256" cy="262" r="150" fill="url(#disc)"/>
    <!-- spear and sword crossed behind the warrior -->
    <g stroke="#140d07" stroke-linecap="round">
      <line x1="120" y1="420" x2="372" y2="110" stroke-width="13"/>
      <path d="M372 110 L404 66 L386 122 Z" fill="#e9e2d2" stroke="#140d07" stroke-width="6" stroke-linejoin="round"/>
      <line x1="392" y1="420" x2="168" y2="132" stroke-width="16"/>
      <line x1="350" y1="352" x2="398" y2="316" stroke-width="14"/>
      <line x1="168" y1="132" x2="140" y2="96" stroke-width="12"/>
    </g>
    <!-- the stick warrior: head with the gold band, neck and shoulders -->
    <path d="M256 300 L256 372 M188 410 Q256 352 324 410" stroke="url(#ink)" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="256" cy="238" r="70" fill="url(#ink)"/>
    <path d="M187 236 Q256 262 325 236" stroke="url(#gold)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M318 230 Q352 244 362 270" stroke="url(#gold)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <ellipse cx="232" cy="212" rx="18" ry="10" fill="#ffffff" opacity=".18" transform="rotate(-30 232 212)"/>
  </g>
</svg>
